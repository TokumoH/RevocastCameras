<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RevoCast Câmeras</title>
    <script>
      // /obs/palco (Fonte de navegador do OBS): fundo transparente e esquema claro já na primeira pintura,
      // antes do CSS e do app (N2); as barras finais saem como no resolverRota.
      if (location.pathname.replace(/\/+$/, '') === '/obs/palco') {
        document.documentElement.classList.add('palco')
        document.documentElement.style.colorScheme = 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lilita+One&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
