<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RevoCast Câmeras</title>
    <script>
      // /obs/palco e /obs/camera (Fontes de navegador do OBS): fundo transparente e esquema claro já na primeira pintura,
      // antes do CSS e do app (N2; D8 do PLA-005); as barras finais saem como no resolverRota.
      ;(function () {
        var caminho = location.pathname.replace(/\/+$/, '')
        var classe = caminho === '/obs/palco' ? 'palco' : caminho === '/obs/camera' ? 'obs-camera' : ''
        if (classe) {
          document.documentElement.classList.add(classe)
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lilita+One&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
